name: Security Audit

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * 0' # weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-secrets:
    name: Detect-Secrets Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: |
          python -m pip install --only-binary :all: "detect-secrets==1.5.0"

      - name: Run Detect-Secrets with Baseline
        continue-on-error: true
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

  bandit-pip-audit:
    name: Bandit SAST & Pip-Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade --only-binary :all: "pip==24.3.1"
          python -m pip install --only-binary :all: "bandit==1.8.3" "pip-audit==2.8.0"

      - name: Bandit security scan
        continue-on-error: true
        run: |
          bandit -r app src -ll -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Pip-audit dependency audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --format=json > pip-audit.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
