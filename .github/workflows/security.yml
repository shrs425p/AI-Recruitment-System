name: Security Audit

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 0' # weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit-pip-audit:
    name: Bandit SAST & Pip-Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade --only-binary :all: "pip==24.3.1"
          python -m pip install --only-binary :all: "bandit==1.8.3" "pip-audit==2.8.0"

      - name: Bandit security scan
        continue-on-error: true
        run: |
          bandit -r app src -ll -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Pip-audit dependency audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --format=json > pip-audit.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
