name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Type Check & Test Suite
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Black
        continue-on-error: true
        run: python -m black --check .

      - name: Type check with Mypy
        continue-on-error: true
        run: python -m mypy app src main.py

      - name: Check Pre-commit hooks
        continue-on-error: true
        run: python -m pre_commit run --all-files

      - name: Compile application code
        run: python -m compileall -q main.py app src tests

      - name: Run tests with pytest & coverage
        run: |
          python -m pytest --cov=src --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml tests --timeout=90

      - name: Run environment pre-flight
        run: python scripts/verify_environment.py

      - name: Check SonarCloud Quality Gate
        continue-on-error: true
        run: python scripts/check_sonar.py

      - name: Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  packaging-test:
    name: PyInstaller Packaging Smoke Test
    needs: quality-and-tests
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm scripts/build.spec

      - name: Verify build output exists
        run: |
          if (!(Test-Path "dist\ARS\ARS.exe")) {
            Write-Error "dist\ARS\ARS.exe was not generated by PyInstaller!"
            exit 1
          }
          Write-Host "PyInstaller successfully produced dist\ARS\ARS.exe"
