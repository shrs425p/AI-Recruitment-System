name: CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Ruff & Pytest
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Compile application code
        run: python -m compileall -q main.py app src tests

      - name: Run tests with pytest & coverage
        run: |
          python -m pytest --cov=src --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml tests --timeout=90

      - name: Run environment pre-flight
        run: python scripts/verify_environment.py

      - name: Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
