name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov pytest-timeout

      - name: Create required runtime directories
        run: |
          python -c "
          import os
          for d in [
            'data/input/pdfs', 'data/input/texts',
            'data/output/ranking', 'data/output/scheduling',
            'data/output/nlp', 'data/db'
          ]:
              os.makedirs(d, exist_ok=True)
          "

      - name: Lint (Ruff)
        run: ruff check app/ src/ main.py --exclude venv,build,dist

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            --cov=app --cov=src \
            --cov-report=xml --cov-report=term-missing \
            --timeout=60
