name: CI Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov pytest-timeout bandit

      - name: Code Formatting Check (Ruff)
        run: ruff check .

      - name: Static Type Check (Mypy)
        run: python -m mypy app src tests main.py config.py

      - name: Security Scan (Bandit)
        run: bandit -r app/ src/

      - name: Pre-Flight Environment Verification
        run: python scripts/verify_environment.py

      - name: Automated Unit & Integration Tests (Pytest)
        run: pytest tests/ --timeout=60
