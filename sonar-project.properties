# SonarCloud Configuration
sonar.projectKey=shrs425p_AI-Recruitment-System
sonar.organization=shrs425p

# Python Version Target
sonar.python.version=3.10, 3.11, 3.12

# Source and Test Directories
sonar.sources=app,src,config,scripts,main.py
sonar.tests=tests

# Multicriteria Issue Exceptions
# e1: Candidate portal relies on client-bound HMAC token authentication, not cookies, rendering CSRF inapplicable
# e2: Mock test resume generator generates dummy data using standard pseudorandom module
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=**/app/__init__.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=**/scripts/generate_resumes.py

# Exclude bundled third-party binaries, installer tooling, and speech models from analysis
sonar.exclusions=models/**,Inno Setup 6/**