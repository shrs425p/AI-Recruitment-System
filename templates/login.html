<!DOCTYPE html>
<html lang="en" class="{{ 'dark' if config.THEME == 'dark' else '' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI Recruitment System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* ── Frameless title bar (matches base.html) ── */
        .custom-title-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: #fff;
            color: #23232b;
            font-family: 'DM Sans', sans-serif;
            user-select: none;
            -webkit-app-region: drag;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 1px 4px 0 rgba(0,0,0,0.03);
            z-index: 9999;
        }
        .custom-title-bar .title {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        .window-controls {
            margin-left: auto;
            display: flex;
            gap: 4px;
            -webkit-app-region: no-drag;
        }
        .window-btn {
            width: 32px; height: 28px; border: none; background: transparent;
            color: #23232b; font-size: 1.25rem; cursor: pointer; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .window-btn:hover { background: #f0f0f0; }
        .window-btn.close:hover { background: #ff4d4f; color: #fff; }

        /* Dark theme overrides for login page */
        html.dark body { background: #121214; }
        html.dark .custom-title-bar { background: #1a1a1e; color: #e0e0e4; border-bottom-color: #2c2c30; }
        html.dark .window-btn { color: #b0b0b6; }
        html.dark .window-btn:hover { background: #333; color: #fff; }
        html.dark .login-box { background: #1a1a1e; border-color: #2c2c30; }
        html.dark h2 { color: #f0f0f4; }
        html.dark .login-desc { color: #8a8a90; }
        html.dark label { color: #b0b0b6; }
        html.dark input[type="text"], html.dark input[type="password"] {
            background: #222226; color: #e0e0e4; border-color: #3a3a3e;
        }
        html.dark input:focus { border-color: #60a5fa; background: #28282c; }
        html.dark .login-footer { color: #555; }
        html.dark .logo-title { color: #f0f0f4; }

        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg, #f5f5f7);
            font-family: 'DM Sans', sans-serif;
        }

        .login-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .login-logo .logo-mark {
            width: 40px;
            height: 40px;
            background: #18181b;
            color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .login-logo .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .login-logo .logo-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #18181b;
        }

        .login-logo .logo-sub {
            font-size: 0.78rem;
            color: #888;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #18181b;
            margin: 0 0 6px;
        }

        .login-desc {
            font-size: 0.85rem;
            color: #666;
            margin: 0 0 28px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            background: #fafafa;
            color: #18181b;
            margin-bottom: 18px;
            outline: none;
            transition: border 0.15s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #18181b;
            background: #fff;
        }

        .error-msg {
            background: #fff1f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #18181b;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: background 0.15s;
        }

        button[type="submit"]:hover {
            background: #333;
        }

        .login-footer {
            text-align: center;
            font-size: 0.78rem;
            color: #aaa;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <!-- Frameless window controls (matches base.html) -->
    <div class="custom-title-bar">
        <span class="title">AI Recruitment System</span>
        <div class="window-controls">
            <button class="window-btn" onclick="window.pywebview.api.minimize()" title="Minimize">&#8211;</button>
            <button class="window-btn" onclick="window.pywebview.api.maximize()" title="Maximize">&#9723;</button>
            <button class="window-btn close" onclick="window.pywebview.api.close()" title="Close">&#10005;</button>
        </div>
    </div>

    <div class="login-box">
        <div class="login-logo">
            <div class="logo-mark">AI</div>
            <div class="logo-text">
                <span class="logo-title">Recruit</span>
                <span class="logo-sub">System</span>
            </div>
        </div>

        <h2>HR Login</h2>
        <p class="login-desc">Sign in to access the recruitment dashboard.</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="hr" autofocus autocomplete="off">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••">

            <button type="submit">Sign In</button>
        </form>

        <div class="login-footer">AI-Driven Autonomous Recruitment System</div>
    </div>
</body>
</html>
