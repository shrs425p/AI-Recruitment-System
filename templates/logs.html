{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div class="page-step">--</div>
    <h1 class="page-title">Real‑time Logs</h1>
    <p class="page-desc">Server output is streamed directly to the browser.</p>
</div>

<div class="card">
    <div class="log-box">
        <pre id="logContainer"></pre>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    const logEl = document.getElementById('logContainer');
    const evtSource = new EventSource('/stream-logs');
    evtSource.onmessage = function(e) {
        logEl.textContent += e.data + "\n";
        logEl.parentElement.scrollTop = logEl.parentElement.scrollHeight;
    };
    evtSource.onerror = function() {
        logEl.textContent += '\n[connection lost]';
        evtSource.close();
    };
</script>
{% endblock %}
